<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
  <!-- Підключення HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3"
    integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq"
    crossorigin="anonymous"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-09Q73E6BWG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-09Q73E6BWG');
  </script>
  <meta charset="UTF-8" />
  <meta name="description" content="Широкий вибір дезінфекційних засобів. Купуйте по доступним цінам.">
  <title>Усі товари - Дезінфекційні засоби</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" />
</head>

<body class="bg-body-tertiary">
  <div th:insert="~{fragments/menu :: #nav-menu}"></div>
  <img th:src="@{/images/header.jpg}" class="img-fluid mx-auto" alt="купити дезінфекційні засоби, Екохім Розвиток" />
  <div th:insert="~{fragments/menu :: #navigator}"></div>
  <!--<div th:text="${currency}" class="container"></div>-->
  <div class="container-fluid">
    <p> 100 грн коштує: <span id="currency-value"></span> <select name="currency" id="currency-select"
        hx-get="/v1/update-currency" hx-target="#currency-value" hx-trigger="change, load">
        <option value="USD" selected>Доллар США (USD)</option>
        <option value="EUR">Євро (EUR)</option>
        <option value="PLN">Польский злотий (PLN)</option>
      </select> </p>
  </div>

  <div class="container">
    <div class="d-grid gap-2 d-md-block">
      <button type="button" class="btn btn-outline-primary" hx-get="/products/category?categoryId=1"
        hx-target="#main-content">Засоби для поверхонь</button>
      <button type="button" class="btn btn-outline-primary" hx-get="/products/category?categoryId=2"
        hx-target="#main-content">Засоби для інструментів</button>
      <button type="button" class="btn btn-outline-primary" hx-get="/products/category?categoryId=3"
        hx-target="#main-content">Антисептики</button>
      <button type="button" class="btn btn-outline-primary" hx-get="/products/category?categoryId=5"
        hx-target="#main-content">Стерилізаційні пакети</button>
      <button type="button" class="btn btn-outline-primary" hx-get="/products/category?categoryId=4"
        hx-target="#main-content">Засоби для гігієни</button>
      <button type="button" class="btn btn-outline-primary" hx-get="/products/category?categoryId=6"
        hx-target="#main-content">Аксесуари до антисептиків</button>
      <button type="button" class="btn btn-outline-primary" hx-get="/products/category?categoryId=7"
        hx-target="#main-content">Промислова хімія</button>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div th:insert="~{fragments/menu :: #bar}" class="col-sm-2"></div>

      <div class="col-sm-10" id="main-content" th:fragment="products">
        <h3>Товари Екохім Розвиток</h3>
        <div class="mb-3">
          <p>Сортувати за : 
            <a th:if="${categoryId == 0}"
               th:href="@{/products(sortField='title', sortDir=${reverseSortDir}, page=0)}">назвою</a>
            <a th:if="${categoryId != 0}"
               hx-get="/products/category"
               th:attr="hx-vals='{&quot;page&quot;:0,&quot;sortField&quot;:&quot;title&quot;,&quot;sortDir&quot;:&quot;' + ${reverseSortDir} + '&quot;,&quot;categoryId&quot;:' + ${categoryId} + '}'"
               hx-target="#main-content"
               hx-swap="outerHTML">назвою</a>
            
            <a th:if="${categoryId == 0}"
               th:href="@{/products(sortField='price', sortDir=${reverseSortDir}, page=0)}">ціною</a>
            <a th:if="${categoryId != 0}"
               hx-get="/products/category"
               th:attr="hx-vals='{&quot;page&quot;:0,&quot;sortField&quot;:&quot;price&quot;,&quot;sortDir&quot;:&quot;' + ${reverseSortDir} + '&quot;,&quot;categoryId&quot;:' + ${categoryId} + '}'"
               hx-target="#main-content"
               hx-swap="outerHTML">ціною</a>
          </p>
        </div>
        <div class="row">
          <div class="card" th:each="product:${products}" style="width: 14rem">
            <img th:src="${product.photoUrl}" class="card-img-top img" alt="..." />
            <div class="card-body">
              <a th:href="@{/products/{id}(id=${product.id})}">
                <h6 class="card-title" th:text="${product.title}">Card title</h6>
              </a>
              <p class="card-text" th:text="${product.price}">Some</p>
              <p class="card-text" th:text="${product.onStock}">Some</p>
              <p class="card-text" th:text="${product.categories[0].title}">Some</p>
              <a th:href="@{/buckets/{id}/add(id=${product.id})}" class="btn btn-primary"
                style="alignment-baseline: bottom">
                Додати товар до корзини</a>
            </div>
          </div>
        </div>
        
        <!-- Пагінація з розумним відображенням сторінок -->
        <div class="nav justify-content-center" th:if="${products.totalPages > 1}">
          <nav aria-label="Page navigation">
            <ul class="pagination">
              <!-- Кнопка "Попередня" -->
              <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" 
                   th:if="${categoryId == 0}"
                   th:href="@{/products(page=${products.number - 1}, sortField=${sortField}, sortDir=${sortDir})}"
                   aria-label="Previous">
                  <span aria-hidden="true">&laquo;</span>
                </a>
                <a class="page-link" 
                   th:if="${categoryId != 0}"
                   hx-get="/products/category"
                   th:attr="hx-vals='{&quot;page&quot;:' + ${products.number - 1} + ',&quot;sortField&quot;:&quot;' + ${sortField} + '&quot;,&quot;sortDir&quot;:&quot;' + ${sortDir} + '&quot;,&quot;categoryId&quot;:' + ${categoryId} + '}'"
                   hx-target="#main-content"
                   hx-swap="outerHTML"
                   aria-label="Previous">
                  <span aria-hidden="true">&laquo;</span>
                </a>
              </li>

              <!-- Перша сторінка -->
              <li class="page-item" th:if="${products.number > 2}" th:classappend="${0 == products.number} ? 'active'">
                <a class="page-link"
                   th:if="${categoryId == 0}"
                   th:href="@{/products(page=0, sortField=${sortField}, sortDir=${sortDir})}">1</a>
                <a class="page-link"
                   th:if="${categoryId != 0}"
                   hx-get="/products/category"
                   th:attr="hx-vals='{&quot;page&quot;:0,&quot;sortField&quot;:&quot;' + ${sortField} + '&quot;,&quot;sortDir&quot;:&quot;' + ${sortDir} + '&quot;,&quot;categoryId&quot;:' + ${categoryId} + '}'"
                   hx-target="#main-content"
                   hx-swap="outerHTML">1</a>
              </li>

              <!-- Три крапки перед поточною сторінкою -->
              <li class="page-item disabled" th:if="${products.number > 3}">
                <span class="page-link">...</span>
              </li>

              <!-- Сторінки навколо поточної (±2) -->
              <th:block th:with="startPage=${products.number - 2 < 0 ? 0 : products.number - 2}, 
                                 endPage=${products.number + 2 >= products.totalPages ? products.totalPages - 1 : products.number + 2}">
                <li class="page-item" 
                    th:each="i : ${#numbers.sequence(startPage, endPage)}"
                    th:classappend="${i == products.number} ? 'active'">
                  <a class="page-link"
                     th:if="${categoryId == 0}"
                     th:href="@{/products(page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
                     th:text="${i + 1}"></a>
                  <a class="page-link"
                     th:if="${categoryId != 0}"
                     hx-get="/products/category"
                     th:attr="hx-vals='{&quot;page&quot;:' + ${i} + ',&quot;sortField&quot;:&quot;' + ${sortField} + '&quot;,&quot;sortDir&quot;:&quot;' + ${sortDir} + '&quot;,&quot;categoryId&quot;:' + ${categoryId} + '}'"
                     hx-target="#main-content"
                     hx-swap="outerHTML"
                     th:text="${i + 1}"></a>
                </li>
              </th:block>

              <!-- Три крапки після поточної сторінки -->
              <li class="page-item disabled" th:if="${products.number < products.totalPages - 4}">
                <span class="page-link">...</span>
              </li>

              <!-- Остання сторінка -->
              <li class="page-item" 
                  th:if="${products.number < products.totalPages - 3}"
                  th:classappend="${products.totalPages - 1 == products.number} ? 'active'">
                <a class="page-link"
                   th:if="${categoryId == 0}"
                   th:href="@{/products(page=${products.totalPages - 1}, sortField=${sortField}, sortDir=${sortDir})}"
                   th:text="${products.totalPages}"></a>
                <a class="page-link"
                   th:if="${categoryId != 0}"
                   hx-get="/products/category"
                   th:attr="hx-vals='{&quot;page&quot;:' + ${products.totalPages - 1} + ',&quot;sortField&quot;:&quot;' + ${sortField} + '&quot;,&quot;sortDir&quot;:&quot;' + ${sortDir} + '&quot;,&quot;categoryId&quot;:' + ${categoryId} + '}'"
                   hx-target="#main-content"
                   hx-swap="outerHTML"
                   th:text="${products.totalPages}"></a>
              </li>

              <!-- Кнопка "Наступна" -->
              <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link"
                   th:if="${categoryId == 0}"
                   th:href="@{/products(page=${products.number + 1}, sortField=${sortField}, sortDir=${sortDir})}"
                   aria-label="Next">
                  <span aria-hidden="true">&raquo;</span>
                </a>
                <a class="page-link"
                   th:if="${categoryId != 0}"
                   hx-get="/products/category"
                   th:attr="hx-vals='{&quot;page&quot;:' + ${products.number + 1} + ',&quot;sortField&quot;:&quot;' + ${sortField} + '&quot;,&quot;sortDir&quot;:&quot;' + ${sortDir} + '&quot;,&quot;categoryId&quot;:' + ${categoryId} + '}'"
                   hx-target="#main-content"
                   hx-swap="outerHTML"
                   aria-label="Next">
                  <span aria-hidden="true">&raquo;</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
  </script>

</body>

</html>
