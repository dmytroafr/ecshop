<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Зміна пароля - ЕКОХІМ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />
    <style>
        .password-form {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px 10px 0 0;
            margin: -30px -30px 20px -30px;
            text-align: center;
        }
        .btn-change-password {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 30px;
            width: 100%;
        }
        .btn-change-password:hover {
            opacity: 0.9;
            color: white;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .password-requirements {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/menu}"></div>

<div class="container">
    <div class="password-form">
        <div class="form-header">
            <h2>🔐 Зміна пароля</h2>
            <p class="mb-0">Користувач: <span th:text="${username}"></span></p>
        </div>

        <!-- Повідомлення про помилки -->
        <div th:if="${error}" class="error-message">
            <strong>❌ Помилка:</strong> <span th:text="${error}"></span>
        </div>

        <!-- Вимоги до пароля -->
        <div class="password-requirements">
            <strong>ℹ️ Вимоги до пароля:</strong>
            <ul class="mb-0 mt-2">
                <li>Мінімум 6 символів</li>
                <li>Новий пароль повинен відрізнятися від поточного</li>
            </ul>
        </div>

        <form th:action="@{/users/{username}/change-password(username=${username})}" 
              th:object="${changePasswordRequest}" 
              method="post">
            
            <!-- Поточний пароль -->
            <div class="mb-3">
                <label for="currentPassword" class="form-label">Поточний пароль</label>
                <input type="password" 
                       class="form-control" 
                       id="currentPassword" 
                       th:field="*{currentPassword}"
                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" 
                     th:errors="*{currentPassword}">
                </div>
            </div>

            <!-- Новий пароль -->
            <div class="mb-3">
                <label for="newPassword" class="form-label">Новий пароль</label>
                <input type="password" 
                       class="form-control" 
                       id="newPassword" 
                       th:field="*{newPassword}"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                       minlength="6"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" 
                     th:errors="*{newPassword}">
                </div>
            </div>

            <!-- Підтвердження нового пароля -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Підтвердження нового пароля</label>
                <input type="password" 
                       class="form-control" 
                       id="confirmPassword" 
                       th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                       minlength="6"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" 
                     th:errors="*{confirmPassword}">
                </div>
            </div>

            <!-- Кнопки -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-change-password">
                    Змінити пароль
                </button>
                <a th:href="@{/users/{username}(username=${username})}" class="btn btn-secondary">
                    Скасувати
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

<!-- Перевірка співпадіння паролів на клієнті -->
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (newPassword !== confirmPassword) {
            e.preventDefault();
            alert('Новий пароль та підтвердження не співпадають!');
        }
    });
</script>
</body>
</html>
