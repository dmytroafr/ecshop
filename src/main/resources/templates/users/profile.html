<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <!-- Підключення HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-09Q73E6BWG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-09Q73E6BWG');
  </script>
  <meta charset="UTF-8" />
  <meta name="description" content="Редагування профілю користувача інтернет-магазину Екохім Розвиток">
  <title>Профіль користувача</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}"/>
  <style>
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      border: 1px solid #c3e6cb;
    }
    .profile-actions {
      margin: 20px 0;
    }
  </style>
</head>

<body class="bg-body-tertiary">
<div th:insert="~{fragments/menu :: #nav-menu}"></div>
<img th:src="@{/images/header.jpg}" class="img-fluid mx-auto" alt="купити дезінфекційні засоби, Екохім Розвиток"/>
<div th:insert="~{fragments/menu :: #navigator}"></div>

<div class="container">
  <div class="row">
    <div th:insert="~{fragments/menu :: #bar}" class="col-sm-2"></div>
    <div class="col-sm-10">
      <div class="row" id="main-content">
        
        <!-- Повідомлення про успіх -->
        <div th:if="${success}" class="success-message">
          <strong>✓ Успіх!</strong> <span th:text="${success}"></span>
        </div>

        <!-- Кнопка зміни пароля -->
        <div class="profile-actions">
          <a th:href="@{/users/{username}/change-password(username=${username})}" 
             class="btn btn-primary">
            🔐 Змінити пароль
          </a>
        </div>

        <table th:if="${user}">
          <thead>
          <tr>
            <th>Показник</th>
            <th>Значення</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="field : ${user}">
            <td th:text="${field.key}"></td>
            <td th:text="${field.value}"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
