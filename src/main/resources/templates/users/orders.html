<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Історія замовлень - ЕКОХІМ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}"/>
    <style>
        .orders-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .order-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .status-NEW { background-color: #17a2b8; color: white; }
        .status-APPROVED { background-color: #ffc107; color: black; }
        .status-PAID { background-color: #28a745; color: white; }
        .status-CANCELLED { background-color: #dc3545; color: white; }
        .status-CLOSED { background-color: #6c757d; color: white; }
        .no-orders {
            text-align: center;
            padding: 50px;
            background: #f8f9fa;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-body-tertiary">
<div th:insert="~{fragments/menu :: #nav-menu}"></div>
<img th:src="@{/images/header.jpg}" class="img-fluid mx-auto" alt="купити дезінфекційні засоби, Екохім Розвиток"/>
<div th:insert="~{fragments/menu :: #navigator}"></div>

<div class="container mt-4">
    <div class="row">
        <div th:insert="~{fragments/menu :: #bar}" class="col-sm-2"></div>
        <div class="col-sm-10">
            <div class="orders-header">
                <h2>📦 Історія замовлень</h2>
                <p class="mb-0">Користувач: <strong th:text="${username}"></strong></p>
            </div>

            <div th:if="${orders.isEmpty()}" class="no-orders">
                <h4>😔 У вас поки немає замовлень</h4>
                <p>Почніть робити покупки прямо зараз!</p>
                <a th:href="@{/products}" class="btn btn-primary btn-lg mt-3">Перейти до товарів</a>
            </div>

            <div th:if="${!orders.isEmpty()}">
                <div th:each="order : ${orders}" class="order-card">
                    <div class="order-header">
                        <div>
                            <h5>Замовлення №<span th:text="${order.id}"></span></h5>
                            <small class="text-muted">
                                Створено: <span th:text="${#temporals.format(order.created, 'dd.MM.yyyy HH:mm')}"></span>
                            </small>
                        </div>
                        <div>
                            <span class="badge badge-lg" 
                                  th:classappend="${'status-' + order.status.name()}"
                                  th:text="${order.status.name()}">
                            </span>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>💰 Сума:</strong> <span th:text="${order.sum + ' грн'}"></span></p>
                            <p><strong>🚚 Доставка:</strong> <span th:text="${order.delivery}"></span></p>
                            <p><strong>💳 Оплата:</strong> <span th:text="${order.payment}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>📅 Оновлено:</strong> 
                                <span th:text="${order.updated != null ? #temporals.format(order.updated, 'dd.MM.yyyy HH:mm') : '-'}"></span>
                            </p>
                            <p th:if="${order.closed != null}">
                                <strong>✅ Закрито:</strong> 
                                <span th:text="${#temporals.format(order.closed, 'dd.MM.yyyy HH:mm')}"></span>
                            </p>
                        </div>
                    </div>

                    <div th:if="${order.details != null && !order.details.isEmpty()}" class="mt-3">
                        <h6>📋 Товари в замовленні:</h6>
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Товар</th>
                                    <th>Кількість</th>
                                    <th>Ціна</th>
                                    <th>Сума</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail : ${order.details}">
                                    <td th:text="${detail.product.title}"></td>
                                    <td th:text="${detail.amount}"></td>
                                    <td th:text="${detail.price + ' грн'}"></td>
                                    <td th:text="${detail.amount * detail.price + ' грн'}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/users/{username}(username=${username})}" class="btn btn-secondary">
                        Повернутися до профілю
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
