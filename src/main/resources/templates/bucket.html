<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <!-- Підключення HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-09Q73E6BWG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-09Q73E6BWG');
  </script>
  <meta charset="UTF-8" />
  <meta name="description" content="Кошик поточного замовлення">
  <title>Кошик замовлення</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}"/>
  <style>
    .bucket-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .bucket-table {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    .order-form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
    }
    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-delete {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-delete:hover {
      background: #c82333;
    }
  </style>
</head>

<body class="bg-body-tertiary">
<div th:insert="~{fragments/menu :: #nav-menu}"></div>
<img th:src="@{/images/header.jpg}" class="img-fluid mx-auto" alt="купити дезінфекційні засоби, Екохім Розвиток"/>
<div th:insert="~{fragments/menu :: #navigator}"></div>

<div class="container">
  <div class="row">
    <div th:insert="~{fragments/menu :: #bar}" class="col-sm-2"></div>
    <div class="col-sm-10">
      <div class="row" id="main-content">
        <div class="bucket-header">
          <h2>🛒 Ваш кошик</h2>
          <h4 class="mb-0">Загальна сума: <b th:text="${bucket.sum + ' грн'}">0</b></h4>
        </div>

        <div class="bucket-table">
          <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr>
              <th>Назва товару</th>
              <th>Кількість</th>
              <th>Ціна за од.</th>
              <th>Сума</th>
              <th>Дії</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="product : ${bucket.productList}" th:id="'product-row-' + ${product.productId}">
              <td><strong th:text="${product.title}">товар</strong></td>
              <td>
                <div class="quantity-controls">
                  <form th:action="@{/buckets/{productId}/decrease(productId=${product.productId})}" method="post" style="display:inline-block;">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">➖</button>
                  </form>
                  <span class="fw-bold" th:text="${product.amount}">2</span>
                  <form th:action="@{/buckets/{productId}/increase(productId=${product.productId})}" method="post" style="display:inline-block;">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">➕</button>
                  </form>
                </div>
              </td>
              <td th:text="${product.price + ' грн'}">11</td>
              <td><strong th:text="${product.sum + ' грн'}">22</strong></td>
              <td>
                <form th:action="@{/buckets/{productId}/delete(productId=${product.productId})}" method="post" style="display:inline;">
                  <input type="hidden" name="_method" value="DELETE">
                  <button type="submit" class="btn-delete" onclick="return confirm('Ви впевнені?')">🗑️ Видалити</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <form th:action="@{/orders}" method="post" class="order-form">
          <h4 class="mb-4">📋 Оформлення замовлення</h4>
          
          <div class="mb-3">
            <label class="form-label"><strong>🚚 Місто та номер відділення Нової Пошти</strong></label>
            <input type="text" class="form-control" name="delivery" placeholder="Наприклад: Київ, відділення №1" required />
          </div>
          
          <div class="mb-3">
            <label class="form-label"><strong>💳 Метод оплати</strong></label>
            <input type="text" class="form-control" name="payment" placeholder="Наприклад: Оплата при отриманні" required />
          </div>

          <button type="submit" class="btn btn-success btn-lg w-100">
            ✅ Оформити замовлення
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
